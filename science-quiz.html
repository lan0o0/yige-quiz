  let currentQuestion = 0;
  let score = 0;
  let openAnswer = "";
  let answered = false;

  function startQuiz() {
    currentQuestion = 0;
    score = 0;
    openAnswer = "";
    showPage('quiz-page');
    loadQuestion();
  }

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];

    document.getElementById('question-num').textContent = `第 ${currentQuestion + 1} 题`;
    document.getElementById('progress-fill').style.width = `${((currentQuestion) / questions.length) * 100}%`;
    document.getElementById('score-display').textContent = `⭐ ${score} 分`;
    document.getElementById('question-icon').textContent = q.icon;
    document.getElementById('question-text').textContent = q.text;

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';

    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = `<span class="option-letter">${letters[index]}</span><span>${opt}</span>`;
      btn.onclick = () => selectOption(index);
      optionsDiv.appendChild(btn);
    });

    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').textContent = '';
    document.getElementById('next-btn-wrap').classList.remove('show');

    const card = document.getElementById('question-card');
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'pop 0.5s ease';
  }

  function selectOption(index) {
    if (answered) return;
    answered = true;

    const q = questions[currentQuestion];
    const options = document.querySelectorAll('.option');

    options.forEach((opt, i) => {
      opt.classList.add('disabled');
      if (i === q.correct) {
        opt.classList.add('correct');
      } else if (i === index && index !== q.correct) {
        opt.classList.add('wrong');
      }
    });

    const feedback = document.getElementById('feedback');
    if (index === q.correct) {
      score += 1;
      feedback.className = 'feedback correct show';
      feedback.innerHTML = "🎉 答对啦！<br>" + q.feedback;
    } else {
      feedback.className = 'feedback wrong show';
      feedback.innerHTML = "⚠️ 这道题要注意哦！<br>" + q.feedback;
    }

    document.getElementById('score-display').textContent = `⭐ ${score} 分`;
    document.getElementById('next-btn-wrap').classList.add('show');
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      document.getElementById('open-score-display').textContent = `⭐ ${score} 分`;
      showPage('open-page');
    }
  }

  function submitOpenAnswer() {
    const answer = document.getElementById('open-answer').value.trim();
    if (answer === '') {
      alert('小朋友，先写下你的科学小发明再提交哦～');
      return;
    }
    openAnswer = answer;
    showResult();
  }

  function showResult() {
    document.getElementById('final-score').textContent = score;

    let badge, title, message, stars;

    if (score === 30) {
      badge = "🏆";
      title = "满分小科学家！";
      message = "太棒了！你全部答对了，是一个超级厉害的小科学家！把这些科学知识记在心里，去探索更多奥秘吧～";
      stars = "⭐⭐⭐⭐⭐";
    } else if (score >= 25) {
      badge = "🥇";
      title = "太棒啦！";
      message = "你的科学知识非常丰富！记住答错的题目，继续探索，科学的世界无穷无尽～";
      stars = "⭐⭐⭐⭐✨";
    } else if (score >= 18) {
      badge = "🥈";
      title = "做得不错！";
      message = "你已经掌握了不少科学知识！继续观察生活中的科学现象，会有更多发现哦～";
      stars = "⭐⭐⭐✨✨";
    } else if (score >= 10) {
      badge = "🥉";
      title = "继续努力！";
      message = "你对科学有了一些了解，但还有更多奥秘等着你发现！科学就在身边，多观察多思考～";
      stars = "⭐⭐✨✨✨";
    } else {
      badge = "💪";
      title = "加油哦！";
      message = "科学非常有趣，和爸爸妈妈一起再做做实验吧！生活中处处有科学的小秘密哦～";
      stars = "⭐✨✨✨✨";
    }

    document.getElementById('result-badge').textContent = badge;
    document.getElementById('result-title').textContent = title;
    document.getElementById('result-message').textContent = message;
    document.getElementById('stars').textContent = stars;
    document.getElementById('result-answer-text').textContent = openAnswer;

    showPage('result-page');
  }

  function restartQuiz() {
    document.getElementById('open-answer').value = '';
    showPage('start-page');
  }
