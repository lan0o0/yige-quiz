  let currentQuestion = 0;
  let score = 0;
  let openAnswer = "";
  let answered = false;

  function startQuiz() {
    currentQuestion = 0;
    score = 0;
    openAnswer = "";
    showPage('quiz-page');
    loadQuestion();
  }

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];

    document.getElementById('question-num').textContent = `第 ${currentQuestion + 1} 题`;
    document.getElementById('progress-fill').style.width = `${((currentQuestion) / questions.length) * 100}%`;
    document.getElementById('score-display').textContent = `⭐ ${score} 分`;
    document.getElementById('question-icon').textContent = q.icon;
    document.getElementById('question-text').textContent = q.text;

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';

    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = `<span class="option-letter">${letters[index]}</span><span>${opt}</span>`;
      btn.onclick = () => selectOption(index);
      optionsDiv.appendChild(btn);
    });

    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').textContent = '';
    document.getElementById('next-btn-wrap').classList.remove('show');

    const card = document.getElementById('question-card');
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'pop 0.5s ease';
  }

  function selectOption(index) {
    if (answered) return;
    answered = true;

    const q = questions[currentQuestion];
    const options = document.querySelectorAll('.option');

    options.forEach((opt, i) => {
      opt.classList.add('disabled');
      if (i === q.correct) {
        opt.classList.add('correct');
      } else if (i === index && index !== q.correct) {
        opt.classList.add('wrong');
      }
    });

    const feedback = document.getElementById('feedback');
    if (index === q.correct) {
      score += 1;
      feedback.className = 'feedback correct show';
      feedback.innerHTML = "🎉 答对啦！<br>" + q.feedback;
    } else {
      feedback.className = 'feedback wrong show';
      feedback.innerHTML = "⚠️ 这道题要注意哦！<br>" + q.feedback;
    }

    document.getElementById('score-display').textContent = `⭐ ${score} 分`;
    document.getElementById('next-btn-wrap').classList.add('show');
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      document.getElementById('open-score-display').textContent = `⭐ ${score} 分`;
      showPage('open-page');
    }
  }

  function submitOpenAnswer() {
    const answer = document.getElementById('open-answer').value.trim();
    if (answer === '') {
      alert('小朋友，先写下你的太空探索梦想再提交哦～');
      return;
    }
    openAnswer = answer;
    showResult();
  }

  function showResult() {
    document.getElementById('final-score').textContent = score;

    let badge, title, message, stars;

    if (score === 30) {
      badge = "🏆";
      title = "太空小博士！";
      message = "太棒了！你全部答对了，是一个超级太空小专家！宇宙的秘密你都知道啦，将来一定能成为优秀的宇航员～";
      stars = "⭐⭐⭐⭐⭐";
    } else if (score >= 25) {
      badge = "🥇";
      title = "太空探险家！";
      message = "你的太空知识非常丰富！记住答错的题目，下次一定全对！继续探索神秘的宇宙吧～";
      stars = "⭐⭐⭐⭐✨";
    } else if (score >= 18) {
      badge = "🥈";
      title = "小小宇航员！";
      message = "你已经掌握了不少太空知识！继续学习，宇宙中还有很多秘密等着你去发现～";
      stars = "⭐⭐⭐✨✨";
    } else if (score >= 10) {
      badge = "🥉";
      title = "继续探索！";
      message = "你对宇宙有了一些了解，但还要多学习哦！抬头看看星空，每一颗星星都有它的故事～";
      stars = "⭐⭐✨✨✨";
    } else {
      badge = "🚀";
      title = "加油哦！";
      message = "宇宙非常神奇又神秘，和爸爸妈妈一起多看看星空、多读读科普书吧！每一次探索都是一次冒险～";
      stars = "⭐✨✨✨✨";
    }

    document.getElementById('result-badge').textContent = badge;
    document.getElementById('result-title').textContent = title;
    document.getElementById('result-message').textContent = message;
    document.getElementById('stars').textContent = stars;
    document.getElementById('result-answer-text').textContent = openAnswer;

    showPage('result-page');
  }

  function restartQuiz() {
    document.getElementById('open-answer').value = '';
    showPage('start-page');
  }
</script>
